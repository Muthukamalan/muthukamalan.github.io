<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Breadth-First Traversal — Visualizer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0e0f;
    --panel:#111516;
    --panel-2:#14181a;
    --border:#232a2c;
    --text:#e7ecec;
    --dim:#7c8a8c;
    --accent:#7cc4f4;      /* blue - active / visiting (distinct from DFS's teal) */
    --accent-dim:#1c3b4d;
    --queue:#c9a6f4;       /* violet - queue membership */
    --queue-dim:#33244d;
    --visited:#4b5a5c;
    --edge:#2a3234;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Space Grotesk', sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:28px 16px 40px;
  }
  .wrap{width:100%;max-width:1180px;}
  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    margin-bottom:18px;
    flex-wrap:wrap;
    gap:12px;
    border-bottom:1px solid var(--border);
    padding-bottom:14px;
  }
  h1{
    font-size:20px;
    font-weight:600;
    margin:0 0 4px;
    letter-spacing:0.2px;
  }
  h1 span{color:var(--accent);}
  .sub{
    font-family:var(--mono);
    font-size:12px;
    color:var(--dim);
  }
  .level-toggle{
    display:flex;
    gap:6px;
    background:var(--panel-2);
    border:1px solid var(--border);
    border-radius:8px;
    padding:4px;
    font-family:var(--mono);
    font-size:11.5px;
    color:var(--dim);
    align-items:center;
    padding-left:10px;
  }
  .level-toggle input{ accent-color:var(--accent); margin-left:6px; }

  .grid{
    display:grid;
    grid-template-columns:1.4fr 1fr;
    gap:16px;
  }
  @media (max-width:880px){ .grid{grid-template-columns:1fr;} }

  .panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    overflow:hidden;
  }
  .panel-head{
    font-family:var(--mono);
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--dim);
    padding:10px 14px;
    border-bottom:1px solid var(--border);
    display:flex;
    justify-content:space-between;
    align-items:center;
  }

  #treeSvg{width:100%;height:auto;display:block;background:
    radial-gradient(circle at 20% 10%, #101617 0%, var(--panel) 60%);}
  .node-circle{
    fill:var(--panel-2);
    stroke:var(--edge);
    stroke-width:1.6;
    transition:all .25s ease;
  }
  .node-label{
    fill:var(--dim);
    font-family:var(--mono);
    font-size:15px;
    font-weight:600;
    text-anchor:middle;
    dominant-baseline:central;
    pointer-events:none;
    transition:fill .25s ease;
  }
  .edge{
    stroke:var(--edge);
    stroke-width:1.6;
    transition:stroke .25s ease, stroke-width .25s ease;
  }
  .node-circle.in-queue{ stroke:var(--queue); stroke-width:2.4; fill:#1d1530;}
  .node-label.in-queue{ fill:var(--queue);}
  .node-circle.active{ stroke:var(--accent); stroke-width:3; fill:#0e2130; filter:drop-shadow(0 0 6px rgba(124,196,244,.45));}
  .node-label.active{ fill:var(--accent);}
  .node-circle.visited{ stroke:var(--visited); fill:#161b1c;}
  .node-label.visited{ fill:#a9b4b4;}
  .edge.traversed{ stroke:var(--visited); stroke-width:2;}
  .edge.active-edge{ stroke:var(--accent); stroke-width:2.6;}
  .level-band{ fill:none; }
  .level-tag{
    font-family:var(--mono);
    font-size:10px;
    fill:var(--dim);
    text-anchor:start;
  }

  .code{
    font-family:var(--mono);
    font-size:13px;
    line-height:1.9;
    padding:14px 0;
  }
  .code-line{
    padding:2px 16px;
    white-space:pre;
    color:#8a9698;
    border-left:3px solid transparent;
  }
  .code-line .kw{color:#f0a9d0;}
  .code-line .fn{color:#93c5fd;}
  .code-line .cm{color:#5c6a6c; font-style:italic;}
  .code-line.current{
    background:var(--accent-dim);
    color:var(--accent);
    border-left:3px solid var(--accent);
  }

  /* Queue panel — FIFO, front at left */
  #queueBody{
    padding:14px;
    font-family:var(--mono);
    font-size:12.5px;
    min-height:70px;
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
  }
  .queue-frame{
    background:var(--panel-2);
    border:1px solid var(--edge);
    border-bottom:3px solid var(--queue);
    padding:8px 12px;
    border-radius:6px;
    color:var(--queue);
    position:relative;
    animation:pop .18s ease;
  }
  .queue-frame.front::before{
    content:'front';
    position:absolute;
    top:-16px; left:0;
    font-size:9px;
    color:var(--dim);
    letter-spacing:0.05em;
  }
  @keyframes pop{ from{ transform:translateX(-6px); opacity:0;} to{transform:translateX(0); opacity:1;} }
  .queue-empty{ color:var(--dim); font-style:italic; padding:8px 10px;}
  .queue-arrow{ color:var(--dim); font-size:14px;}

  #trail{
    padding:12px 14px;
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    font-family:var(--mono);
    font-size:12.5px;
    min-height:20px;
  }
  .trail-chip{
    background:var(--accent-dim);
    color:var(--accent);
    border:1px solid #2a4a5a;
    border-radius:5px;
    padding:3px 8px;
  }
  .trail-chip.level-break{
    border-left:2px solid var(--queue);
    margin-left:4px;
  }

  .controls{
    display:flex;
    align-items:center;
    gap:10px;
    padding:14px;
    border-top:1px solid var(--border);
    flex-wrap:wrap;
  }
  .controls .spacer{flex:1;}
  button.ctrl{
    font-family:var(--mono);
    font-size:12.5px;
    background:var(--panel-2);
    color:var(--text);
    border:1px solid var(--border);
    padding:8px 14px;
    border-radius:7px;
    cursor:pointer;
    transition:all .15s ease;
  }
  button.ctrl:hover{ border-color:var(--accent); color:var(--accent);}
  button.ctrl:disabled{ opacity:.35; cursor:not-allowed;}
  button.ctrl.primary{ background:var(--accent-dim); color:var(--accent); border-color:#2a4a5a;}
  .step-count{
    font-family:var(--mono);
    font-size:12px;
    color:var(--dim);
    min-width:78px;
    text-align:center;
  }
  input[type=range]{
    flex:1;
    accent-color:var(--accent);
    min-width:100px;
  }

  .desc-bar{
    font-family:var(--mono);
    font-size:12.5px;
    color:var(--text);
    padding:12px 14px;
    border-top:1px solid var(--border);
    background:var(--panel-2);
    min-height:18px;
  }
  .desc-bar .tag{ color:var(--accent); margin-right:8px;}

  .legend{
    display:flex;
    gap:16px;
    flex-wrap:wrap;
    font-family:var(--mono);
    font-size:11px;
    color:var(--dim);
    padding:10px 14px;
    border-top:1px solid var(--border);
  }
  .legend span{display:inline-flex; align-items:center; gap:6px;}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Breadth-First <span>Traversal</span></h1>
      <div class="sub">binary tree · iterative BFS · step-through</div>
    </div>
    <div class="level-toggle">
      show level bands
      <input type="checkbox" id="levelToggle" checked>
    </div>
  </header>

  <div class="grid">
    <div class="panel">
      <div class="panel-head">
        <span>tree</span>
        <span style="color:var(--accent)">level by level, left to right</span>
      </div>
      <svg id="treeSvg" viewBox="0 0 900 380" xmlns="http://www.w3.org/2000/svg"></svg>
      <div class="panel-head" style="border-top:1px solid var(--border); border-bottom:none;">traversal order</div>
      <div id="trail"></div>
    </div>

    <div class="panel">
      <div class="panel-head">bfs(root)</div>
      <div class="code" id="codeBlock"></div>
      <div class="panel-head" style="border-top:1px solid var(--border);">queue (FIFO)</div>
      <div id="queueBody"></div>
    </div>
  </div>

  <div class="panel" style="margin-top:16px;">
    <div class="desc-bar"><span class="tag">▸</span><span id="descText">Ready. Press play or step forward to begin.</span></div>
    <div class="controls">
      <button class="ctrl" id="btnReset">⟲ reset</button>
      <button class="ctrl" id="btnPrev">◂ step</button>
      <button class="ctrl primary" id="btnPlay">▶ play</button>
      <button class="ctrl" id="btnNext">step ▸</button>
      <div class="step-count" id="stepCount">0 / 0</div>
      <div class="spacer"></div>
      <span style="font-family:var(--mono); font-size:11px; color:var(--dim);">speed</span>
      <input type="range" id="speed" min="200" max="1600" value="750" step="50">
    </div>
    <div class="legend">
      <span><span class="dot" style="background:var(--queue);"></span> in queue</span>
      <span><span class="dot" style="background:var(--accent);"></span> currently visiting</span>
      <span><span class="dot" style="background:var(--visited);"></span> settled / dequeued</span>
    </div>
  </div>
</div>

<script>
/* ---------- Tree definition (same shape as the DFS visualizer, for a fair comparison) ---------- */
const tree = {
  id:1, x:450, y:50,
  left:{ id:2, x:250, y:150,
    left:{ id:4, x:150, y:250 },
    right:{ id:5, x:350, y:250,
      left:{ id:7, x:350, y:350 }
    }
  },
  right:{ id:3, x:650, y:150,
    right:{ id:6, x:750, y:250,
      right:{ id:8, x:750, y:350 }
    }
  }
};

const nodes = [];
const edges = [];
const levelY = [50,150,250,350];
(function collect(n, parent, depth){
  if(!n) return;
  n.depth = depth;
  nodes.push(n);
  if(parent) edges.push({from:parent, to:n});
  collect(n.left, n, depth+1);
  collect(n.right, n, depth+1);
})(tree, null, 0);

/* ---------- Pseudocode ---------- */
const code = [
  {t:'function <span class="fn">bfs</span>(root):'},
  {t:'  queue ← [root]'},
  {t:'  <span class="kw">while</span> queue is not empty:'},
  {t:'    node ← queue.dequeue()   <span class="cm">// pop from front</span>'},
  {t:'    visit(node)'},
  {t:'    <span class="kw">if</span> node.left: queue.enqueue(node.left)'},
  {t:'    <span class="kw">if</span> node.right: queue.enqueue(node.right)'},
];

/* ---------- Trace generation (iterative BFS with explicit queue) ---------- */
function buildTrace(){
  const events = [];
  let queue = [tree.id];

  events.push({line:1, queue:[...queue], active:null, text:`enqueue root → queue: [${queue.join(', ')}]`});

  while(queue.length){
    events.push({line:2, queue:[...queue], active:null, text:`queue is not empty, continue looping`});

    const nodeId = queue.shift();
    const node = findNode(nodeId);
    events.push({line:3, queue:[nodeId, ...queue], active:nodeId, text:`dequeue front → node ${nodeId}`, dequeueId:nodeId});

    events.push({line:4, queue:[...queue], active:nodeId, text:`visit(${nodeId}) → add to traversal order`, visitId:nodeId});

    if(node.left){
      queue.push(node.left.id);
      events.push({line:5, queue:[...queue], active:nodeId, text:`enqueue left child ${node.left.id} → queue: [${queue.join(', ')}]`});
    } else {
      events.push({line:5, queue:[...queue], active:nodeId, text:`no left child, skip`});
    }
    if(node.right){
      queue.push(node.right.id);
      events.push({line:6, queue:[...queue], active:nodeId, text:`enqueue right child ${node.right.id} → queue: [${queue.join(', ')}]`});
    } else {
      events.push({line:6, queue:[...queue], active:nodeId, text:`no right child, skip`});
    }
  }
  events.push({line:2, queue:[], active:null, text:`queue is empty → traversal complete`});
  return events;
}
function findNode(id){
  return nodes.find(n=>n.id===id);
}

let trace = buildTrace();
let idx = -1;
let playTimer = null;

/* ---------- SVG render (static structure + level bands) ---------- */
const svg = document.getElementById('treeSvg');
function edgeId(e){ return `edge-${e.from.id}-${e.to.id}`; }
function drawStatic(){
  svg.innerHTML = '';
  if(document.getElementById('levelToggle').checked){
    levelY.forEach((y,i)=>{
      const line = document.createElementNS('http://www.w3.org/2000/svg','line');
      line.setAttribute('x1',20); line.setAttribute('x2',880);
      line.setAttribute('y1', y); line.setAttribute('y2', y);
      line.setAttribute('stroke', '#1a2022'); line.setAttribute('stroke-width','1');
      line.setAttribute('stroke-dasharray','4 4');
      svg.appendChild(line);
      const tag = document.createElementNS('http://www.w3.org/2000/svg','text');
      tag.setAttribute('x', 26); tag.setAttribute('y', y-8);
      tag.setAttribute('class','level-tag');
      tag.textContent = `level ${i}`;
      svg.appendChild(tag);
    });
  }
  edges.forEach(e=>{
    const line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1', e.from.x); line.setAttribute('y1', e.from.y+18);
    line.setAttribute('x2', e.to.x); line.setAttribute('y2', e.to.y-18);
    line.setAttribute('class','edge');
    line.setAttribute('id', edgeId(e));
    svg.appendChild(line);
  });
  nodes.forEach(n=>{
    const c = document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('cx', n.x); c.setAttribute('cy', n.y); c.setAttribute('r', 20);
    c.setAttribute('class','node-circle');
    c.setAttribute('id', `circ-${n.id}`);
    svg.appendChild(c);
    const t = document.createElementNS('http://www.w3.org/2000/svg','text');
    t.setAttribute('x', n.x); t.setAttribute('y', n.y);
    t.setAttribute('class','node-label');
    t.setAttribute('id', `label-${n.id}`);
    t.textContent = n.id;
    svg.appendChild(t);
  });
}
drawStatic();
document.getElementById('levelToggle').addEventListener('change', ()=>{ drawStatic(); render(); });

/* ---------- Code panel render ---------- */
const codeBlock = document.getElementById('codeBlock');
codeBlock.innerHTML = code.map((l,i)=>`<div class="code-line" data-line="${i}">${l.t}</div>`).join('');

/* ---------- Apply event index to UI ---------- */
function render(){
  nodes.forEach(n=>{
    document.getElementById(`circ-${n.id}`).setAttribute('class','node-circle');
    document.getElementById(`label-${n.id}`).setAttribute('class','node-label');
  });
  edges.forEach(e=>{
    const el = document.getElementById(edgeId(e));
    if(el) el.setAttribute('class','edge');
  });
  document.querySelectorAll('.code-line').forEach(el=>el.classList.remove('current'));

  const visitedSet = new Set();
  const trailIds = [];
  for(let i=0;i<=idx;i++){
    if(trace[i].visitId!==undefined){ visitedSet.add(trace[i].visitId); trailIds.push(trace[i].visitId); }
  }
  const queueNow = idx>=0 ? trace[idx].queue : [];
  const activeNode = idx>=0 ? trace[idx].active : null;

  nodes.forEach(n=>{
    const circ = document.getElementById(`circ-${n.id}`);
    const label = document.getElementById(`label-${n.id}`);
    if(visitedSet.has(n.id) && n.id!==activeNode){
      circ.classList.add('visited'); label.classList.add('visited');
    }
    if(queueNow.includes(n.id) && n.id!==activeNode){
      circ.classList.add('in-queue'); label.classList.add('in-queue');
    }
    if(n.id===activeNode){
      circ.classList.add('active'); label.classList.add('active');
    }
  });

  edges.forEach(e=>{
    const el = document.getElementById(edgeId(e));
    if(!el) return;
    const fromSeen = visitedSet.has(e.from.id) || e.from.id===activeNode;
    const toSeen = visitedSet.has(e.to.id) || queueNow.includes(e.to.id) || e.to.id===activeNode;
    if(fromSeen && toSeen) el.classList.add('traversed');
    if(e.from.id===activeNode && queueNow.includes(e.to.id)) el.classList.add('active-edge');
  });

  if(idx>=0 && trace[idx].line>=0){
    const el = document.querySelector(`.code-line[data-line="${trace[idx].line}"]`);
    if(el) el.classList.add('current');
  }

  const queueBody = document.getElementById('queueBody');
  if(queueNow.length===0){
    queueBody.innerHTML = '<div class="queue-empty">— empty —</div>';
  }else{
    queueBody.innerHTML = queueNow.map((id,i)=>
      `${i>0?'<span class="queue-arrow">→</span>':''}<div class="queue-frame${i===0?' front':''}">${id}</div>`
    ).join('');
  }

  let lastDepth = -1;
  document.getElementById('trail').innerHTML = trailIds.map(id=>{
    const n = findNode(id);
    const brk = n.depth!==lastDepth;
    lastDepth = n.depth;
    return `<span class="trail-chip${brk?' level-break':''}">${id}</span>`;
  }).join('') || '<span style="color:var(--dim); font-style:italic;">—</span>';

  document.getElementById('descText').textContent = idx>=0 ? trace[idx].text : 'Ready. Press play or step forward to begin.';
  document.getElementById('stepCount').textContent = `${Math.max(idx+1,0)} / ${trace.length}`;
  document.getElementById('btnPrev').disabled = idx<0;
  document.getElementById('btnNext').disabled = idx>=trace.length-1;
}
render();

/* ---------- Controls ---------- */
document.getElementById('btnNext').addEventListener('click', ()=>stepForward());
document.getElementById('btnPrev').addEventListener('click', ()=>stepBack());
document.getElementById('btnReset').addEventListener('click', ()=>{ pause(); idx=-1; render(); });

function stepForward(){
  if(idx < trace.length-1){ idx++; render(); } else pause();
}
function stepBack(){
  if(idx > -1){ idx--; render(); }
}

const btnPlay = document.getElementById('btnPlay');
let playing = false;
function play(){
  playing = true;
  btnPlay.textContent = '⏸ pause';
  const speedEl = document.getElementById('speed');
  const tick = ()=>{
    if(idx>=trace.length-1){ pause(); return; }
    stepForward();
    playTimer = setTimeout(tick, parseInt(speedEl.value,10));
  };
  tick();
}
function pause(){
  playing = false;
  btnPlay.textContent = '▶ play';
  clearTimeout(playTimer);
}
btnPlay.addEventListener('click', ()=>{ playing ? pause() : play(); });
</script>
</body>
</html>
